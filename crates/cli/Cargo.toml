[package]
name = "kimi-switch-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "kimi-switch CLI: manage multiple Kimi Code accounts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "kimi-switch-cli"
path = "src/main.rs"

[dependencies]
kimi-switch-core.workspace = true
kimi-switch-kimi.workspace = true

anyhow.workspace = true
clap.workspace = true
dialoguer.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# install-hook 对 Kimi Code config.toml 先解析后写回：toml_edit 保留注释与既有条目（issue #162）。
toml_edit.workspace = true
chrono.workspace = true
# Kimi Code 工作目录解析（只读镜像 provider 侧 kimi_home，install-hook 用）。
directories.workspace = true

# 跟随启动拉起器（issue #197）：交互会话判定、本会话 GUI 进程探测与脱离 hook 的进程创建。
# 版本与 src-tauri 的 windows-sys 一致，不另引一份。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# 真实执行器用例：建带 KILL_ON_JOB_CLOSE 的 Job，核对 GUI 脱离 Job 与 breakaway 被拒时的回退。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_JobObjects"] }
