[package]
name = "kimi-switch-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "kimi-switch CLI: manage multiple Kimi Code accounts"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "kimi-switch-cli"
path = "src/main.rs"

[dependencies]
kimi-switch-core.workspace = true
kimi-switch-kimi.workspace = true

anyhow.workspace = true
clap.workspace = true
dialoguer.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# install-hook 对 Kimi Code config.toml 先解析后写回：toml_edit 保留注释与既有条目（issue #162）。
toml_edit.workspace = true
chrono.workspace = true
# Kimi Code 工作目录解析（只读镜像 provider 侧 kimi_home，install-hook 用）。
directories.workspace = true
# 被动触发串行化锁（on-quota-failure 并发收敛，issue #162；与交换锁同款机制）。
fs2.workspace = true

[dev-dependencies]
tempfile = "3"
